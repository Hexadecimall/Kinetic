name: Publish C/C++ Support

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bootstrap
        run: ./scripts/bootstrap
      - name: Test
        run: ./scripts/test
      - name: Build release plugin
        run: ./scripts/build --release
      - name: Stage signed plugin without build-only symbols
        run: |
          mkdir -p build/plugin-release
          cp build/release/cpp-support-cargo/release/libkineticCppSupport.dylib \
            build/plugin-release/libkineticCppSupport.dylib
          xcrun strip -S -x build/plugin-release/libkineticCppSupport.dylib
          codesign --force --sign - build/plugin-release/libkineticCppSupport.dylib
          codesign --verify --strict build/plugin-release/libkineticCppSupport.dylib
      - name: Publish immutable asset
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/publishOfficialPlugin.py \
            --asset build/plugin-release/libkineticCppSupport.dylib
